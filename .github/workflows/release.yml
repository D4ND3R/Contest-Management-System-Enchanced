#
# Release (R9.5): when the owner pushes a tag v*, GoReleaser builds the
# linux amd64/arm64 binaries and publishes the archives, checksums.txt,
# install.sh and the changelog (.goreleaser.yaml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: lint and short tests before publishing
        run: |
          make lint
          go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
