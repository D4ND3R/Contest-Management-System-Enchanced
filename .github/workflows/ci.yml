name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: make lint (gofmt, go vet, license headers)
        run: make lint
      - name: cache the code generators (bin/tools)
        uses: actions/cache@v4
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: generated code is up to date (sqlc, sqlc vet, translation templates)
        run: |
          make generate
          git diff --exit-code
          untracked="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$untracked" ]]; then
            echo "make generate created files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: cross-compile (amd64, arm64)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/cms
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/cms
      # The runners cannot execute the arm64 launcher: at least its machine
      # code must be what its assembler source says.
      - name: seccomp launcher code matches its source (amd64, arm64)
        run: |
          command -v llvm-mc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm; }
          CMS_TEST_REQUIRE_ASSEMBLER=1 go test -count=1 -run 'TestLauncherCodeMatchesSource|TestLauncherELF' ./internal/sandbox/

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    env:
      CMS_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      CMS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: make test (race detector, real PostgreSQL and Valkey)
        run: make test

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The end-to-end tests of the worker (and later the dispatcher) need them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install isolate
        timeout-minutes: 10
        run: |
          set -ex
          codename=$(. /etc/os-release; echo "$VERSION_CODENAME")
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.ucw.cz/isolate/debian/signing-key.asc | sudo tee /etc/apt/keyrings/isolate.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/isolate.asc] http://www.ucw.cz/isolate/debian/ ${codename}-isolate main" \
            | sudo tee /etc/apt/sources.list.d/isolate.list
          sudo apt-get update
          sudo apt-get install -y isolate
          sudo systemctl start isolate.service
          # Tune the runner like a judging host; warnings are not fatal here.
          sudo isolate-check-environment --execute || true
          # isolate is setuid and only executable by root and the isolate group.
          sudo isolate --version
      - name: install the compilers of the supported languages
        timeout-minutes: 15
        run: |
          set -ex
          sudo apt-get install -y --no-install-recommends \
            g++ gcc python3 pypy3 default-jdk-headless fp-compiler ghc mono-mcs mono-runtime \
            rustc golang-go php-cli kotlin
          # Like a judging host (config/languages/go.yaml).
          sudo env CGO_ENABLED=0 GODEBUG=installgoroot=all /usr/bin/go install -pkgdir=/var/lib/cms/go-std std
      - name: cgroups v2 (isolate --cg)
        run: |
          set -ex
          test -f /sys/fs/cgroup/cgroup.controllers
          cat /sys/fs/cgroup/cgroup.controllers
          cat "$(cat /run/isolate/cgroup)/cgroup.controllers"
      - name: make test-sandbox (cgroups on)
        run: |
          go mod download
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            "GOTOOLCHAIN=$(go env GOVERSION)" CMS_SANDBOX_CGROUPS=1 CMS_TEST_REQUIRE_INFRA=1 \
            "CMS_TEST_DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" \
            "CMS_TEST_REDIS_URL=redis://127.0.0.1:6379/0" make test-sandbox
      - name: cms ctl verify-host
        run: |
          make build
          # The runner has SMT and swap: only the report matters here.
          sudo env CMS_WORKER_WORK_DIR=/tmp/cms-worker bin/cms ctl verify-host || true

  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build the worker image
        timeout-minutes: 25
        run: |
          make build
          docker build -f deploy/docker/Dockerfile.worker -t cms-worker:ci .
      - name: isolate with cgroups v2 inside the container
        run: |
          set -o pipefail
          docker run --rm --privileged --cgroupns=private \
            -e CMS_WORKER_WORK_DIR=/var/lib/cms/worker cms-worker:ci ctl verify-host | tee verify.txt || true
          # The runner's SMT and swap may fail; the sandbox itself must pass.
          grep -q '^PASS  isolate cgroup:' verify.txt
          grep -q '^PASS  sandbox run:' verify.txt
