name: C++11 / g++
source_extensions: [.cpp, .cc, .cxx, .c++, .C]
header_extensions: [.h]
object_extensions: [.o]
compilation:
  commands:
    - [/usr/bin/g++, "{eval:-DEVAL}", -std=gnu++11, -O2, -pipe, -static, -s, -o, "{executable}", "{sources}"]
evaluation:
  commands:
    - ["./{executable}", "{args}"]
