name: C# / Mono
source_extensions: [.cs]
executable_extension: .exe
requires_multithreading: true
# The Mono runtime reserves far more address space than it uses.
large_address_space: true
compilation:
  commands:
    - [/usr/bin/mcs, "-out:{executable}", -optimize+, "{sources}"]
evaluation:
  commands:
    # Upstream passes no arguments to C# programs; this fork does, like
    # for every other language (Communication tasks need them).
    - [/usr/bin/mono, "{executable}", "{args}"]
