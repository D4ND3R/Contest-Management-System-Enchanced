name: Python 3 / CPython
source_extensions: [.py]
# A zip application (PEP 441) with the bytecode of every source; the one
# with the entry point is __main__.pyc.
executable_extension: .pyz
compilation:
  commands:
    - [/usr/bin/python3, -m, compileall, -b, .]
    - [/bin/mv, "{main_source|stem}.pyc", __main__.pyc]
    - [/usr/bin/zip, "{executable}", __main__.pyc, "{other_sources|stem}.pyc"]
evaluation:
  commands:
    - [/usr/bin/python3, "{executable}", "{args}"]
