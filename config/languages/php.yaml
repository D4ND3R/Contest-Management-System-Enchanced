name: PHP
source_extensions: [.php]
executable_extension: .php
# The executable is a copy of the main source (/bin/cp, or /bin/true when
# they have the same name, like upstream).
interpreted: true
evaluation:
  commands:
    - [/usr/bin/php, -d, memory_limit=-1, "{executable}", "{args}"]
