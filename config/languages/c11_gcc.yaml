name: C11 / gcc
source_extensions: [.c]
header_extensions: [.h]
object_extensions: [.o]
compilation:
  commands:
    - [/usr/bin/gcc, "{eval:-DEVAL}", -std=gnu11, -O2, -pipe, -static, -s, -o, "{executable}", "{sources}", -lm]
evaluation:
  commands:
    - ["./{executable}", "{args}"]
