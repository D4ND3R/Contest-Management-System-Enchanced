# Configuration of a CMS installation. Every service reads the same file.
#
# Every setting can be overridden with an environment variable named CMS_
# plus its path in upper case with "_" between levels, for example
# database.url -> CMS_DATABASE_URL, contest_web.listen -> CMS_CONTEST_WEB_LISTEN.
# NAME_FILE (e.g. CMS_SECRET_KEY_FILE) reads the value from a file.
#
# The values below are the defaults. The installer writes /etc/cms/cms.yaml
# only if it does not exist yet.

# Shared secret: the keys that sign cookies and CSRF tokens, of the secret
# scoreboard links and of the blob server are derived from it. Hexadecimal,
# at least 16 bytes, and THE SAME in every service of the installation.
# Generate it once with `cms ctl gen-secret`. Judges on other machines
# (storage.backend remote) do not need it: give them storage.remote.token.
secret_key: ""
# Repository linked from the footer of every site (AGPL). Empty means the
# upstream repository of this fork; change it if you run modified code.
source_url: ""
# Local state: blobs (when storage.backend is local), backups, ...
data_dir: /var/lib/cms
# Initial timezone of the server. The administration can change it later on
# the Server page; the value stored in the database then wins.
timezone: UTC
# Directory with more programming languages, one YAML file each (the format
# of the built-in ones in config/languages). A file with the name of a
# built-in language replaces it. Every service, judges included, must see
# the same files. Empty: the built-in languages only.
languages_dir: ""

log:
  level: info    # debug, info, warn, error
  format: json   # json (production) or text (development)

database:
  url: postgres://cms@localhost:5432/cms?sslmode=disable
  max_conns: 20

redis:
  # Valkey or Redis >= 7. Job queues use Streams, live events use pub/sub.
  url: redis://localhost:6379/0
  key_prefix: "cms:"

storage:
  # Where files (statements, test cases, submissions...) are stored, by the
  # SHA-256 of their content:
  #   local:  a directory of this machine;
  #   s3:     an S3-compatible bucket (AWS, MinIO, Garage...);
  #   remote: the blob server of the dispatcher, for judges on other
  #           machines (they never connect to the database).
  backend: local
  local:
    path: /var/lib/cms/blobs
  s3:
    # host[:port]; empty means AWS (s3.amazonaws.com).
    endpoint: ""
    region: ""
    bucket: ""
    # Objects are named <prefix>/ab/<digest>.
    prefix: ""
    access_key: ""
    secret_key: ""
    use_ssl: true
  remote:
    # Base URL of the blob server, e.g. http://10.0.0.1:8891.
    url: ""
    # Credential of the judge: run `cms ctl blob-token` on a machine that
    # has secret_key and copy its output here. It only allows reading and
    # adding files, so judges never need secret_key.
    token: ""
  # On-disk LRU cache in front of the s3 and remote backends (workers, web
  # servers). Each service keeps its own cache in cache_dir/<service>, of at
  # most cache_size_mb; 0 disables it. cache_dir/<service>/tmp also holds
  # the temporary copies of uploads (up to 1 GiB each): keep cache_dir on
  # disk, not on a tmpfs.
  cache_dir: /var/cache/cms/blobs
  cache_size_mb: 2048

contest_web:
  listen: 127.0.0.1:8888
  # Metrics, detailed health and pprof. Keep it on localhost.
  ops_listen: 127.0.0.1:9188
  # Serve a single contest (by name). Empty: contest list at "/".
  contest: ""
  # Reverse proxies in front of the site (to read X-Forwarded-For).
  num_proxies: 0
  cookie_duration: 3h0m0s
  max_submission_length: 100000
  max_input_length: 5000000
  # Lets administrators impersonate users through the API. Empty disables it.
  admin_token: ""
  docs_path: /usr/share/cms/docs

admin_web:
  listen: 127.0.0.1:8889
  ops_listen: 127.0.0.1:9189
  num_proxies: 0
  cookie_duration: 10h0m0s

ranking_web:
  listen: 127.0.0.1:8890
  ops_listen: 127.0.0.1:9190
  num_proxies: 0
  # Scoreboard state pushed by the dispatcher (no database access needed).
  data_dir: /var/lib/cms/ranking

dispatcher:
  ops_listen: 127.0.0.1:9191
  # Serve the blob store to judges on other machines (their storage.backend
  # is remote, storage.remote.url points here and storage.remote.token is
  # printed by `cms ctl blob-token`). Empty: disabled. Needs secret_key and
  # the local or s3 backend. Put it behind TLS if judges reach it over an
  # untrusted network.
  blob_listen: ""
  # How often to look in the database for work nobody asked for (a lost
  # notification, a crash). Only unfinished results are read.
  sweep_interval: 1m0s
  # Failed attempts (judging infrastructure failures, never a contestant's
  # error) of a compilation or of the evaluations before giving up until an
  # admin reevaluates (CMS MAX_*_TRIES). The admin site and cmsctl read
  # them too.
  max_compilation_tries: 3
  max_evaluation_tries: 3
  # Largest number of results stored in one transaction.
  result_batch: 128

worker:
  ops_listen: 127.0.0.1:9192
  # Name shown on the judges page and used in the job queue. Empty: the
  # hostname. Two running workers cannot share a name: give each worker of
  # a machine its own (letters, digits, ".", "_", "-"; at most 64).
  name: ""
  # Jobs run in parallel: at most one per physical core reserved for judging.
  concurrency: 1
  # isolate box ids [box_id_base, box_id_base + box_count). Workers on the
  # same machine need disjoint ranges (`cms ctl verify-host` checks it).
  # At least 2 per job slot (concurrency): Batch tasks with a checker and
  # TwoSteps tasks use 2 boxes at a time, Communication tasks one per
  # process plus one for the manager, Interactive tasks the process limit
  # plus one. A job that needs more boxes than box_count fails.
  box_id_base: 0
  box_count: 100
  # Converted to an absolute path at startup (isolate rejects relative dirs).
  work_dir: /var/lib/cms/worker
  isolate_path: isolate
  # Keep the box directories after each job (debugging only).
  keep_sandbox: false
  # Run contestant programs under a seccomp filter: forbidden system calls
  # (ptrace, mount, unshare, network sockets...) give "Security violation".
  # Compilers, checkers and managers never run under it.
  seccomp: true
  # How long a stopping worker lets its running jobs finish; the others go
  # back to the queue (0: at once). Keep it below the stop timeout of the
  # supervisor (Docker: 10s by default; systemd: 90s).
  shutdown_timeout: 8s
  # Longest a job may take (evaluations get four times their time limit on
  # top); a job still running then fails and is retried. Only stops jobs
  # stuck because of a fault: the sandbox enforces the real limits.
  job_timeout: 10m0s
  # How long a successful compilation is remembered in Valkey: an
  # identical one (same language, compiler, task type, sources and
  # graders) reuses its executable. 0 disables the cache.
  compilation_cache_ttl: 168h0m0s

monitor:
  listen: 127.0.0.1:9193

sandbox:
  # isolate with cgroups v2 (--cg): memory limits for the whole process
  # tree and "Memory limit exceeded" detection. false is ONLY for
  # development machines without cgroups v2 (memory limited per process
  # as address space, exceeding it looks like a runtime error).
  cgroups: true
  # Largest file a sandboxed program may write.
  max_file_size_kib: 1048576
  compilation:
    max_processes: 1000
    max_time_sec: 10
    max_memory_kib: 524288
  # Checkers, managers and generators.
  trusted:
    max_processes: 1000
    max_time_sec: 10
    max_memory_kib: 4194304
